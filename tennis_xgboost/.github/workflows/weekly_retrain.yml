name: Weekly Tennis Model Retraining

on:
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd tennis_xgboost
          pip install -r requirements.txt

      - name: Run weekly retraining
        env:
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
        run: |
          cd tennis_xgboost
          python scripts/weekly_retrain.py

      - name: Commit updated models and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tennis_xgboost/models/ tennis_xgboost/reports/ tennis_xgboost/data/raw/
          git diff --cached --quiet || git commit -m "chore: weekly model retrain $(date -u +%Y-%m-%d)"
          git push
